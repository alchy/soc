<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SOC portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if identity %}
  <header class="top">
    <div class="brand">SOC&nbsp;portal <small>triaz vzorku</small></div>
    <div>
      <span class="user">{{ identity.display_name }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <button class="btn" type="submit">Odhlasit</button>
      </form>
    </div>
  </header>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
