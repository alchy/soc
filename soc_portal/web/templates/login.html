{% extends "base.html" %}
{% block title %}Sign in - SOC portal{% endblock %}
{% block body %}
<div class="d-grid min-vh-100 align-items-center justify-content-center">
  <form class="card p-4" style="width: 340px;" method="post" action="{{ url_for('auth.login') }}">
    <h1 class="h5 mb-1">SOC portal</h1>
    <p class="text-secondary small mb-4">Analyst sign-in</p>

    {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <label class="form-label small text-secondary" for="username">Username</label>
    <input class="form-control mb-3" type="text" id="username" name="username"
           autocomplete="username" autofocus required>

    <label class="form-label small text-secondary" for="credential">{{ cred_label }}</label>
    <input class="form-control mb-4" type="password" id="credential" name="credential"
           autocomplete="one-time-code" inputmode="text" required
           {% if retry_after %}disabled{% endif %}>

    <button class="btn btn-primary" type="submit"
            {% if retry_after %}disabled{% endif %}>Sign in</button>
  </form>
</div>
{% endblock %}
