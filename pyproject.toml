[project]
name = "soc-api"
version = "0.1.0"
description = "Prijem malware vzorku pro analyzu - REST API nad access-managerem"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Pozn.: extract-msg tranzitivne tahne oletools (pres RTFDE), takze olevba
# komponenta (soc_mail.macros) ma zavislost splnenou vsude, kde je extract-msg.
# Uvadime oletools i explicitne - at je zamer videt a verze pinnutelna.
dependencies = ["flask>=3.0", "waitress>=3.0", "pyzipper>=0.3",
                "extract-msg>=0.50", "oletools>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Bez tohohle vyctu skonci `pip install -e .` chybou "Multiple top-level
# packages discovered in a flat-layout: ['deploy', 'soc_api']". Setuptools
# si `tests`, `docs` a `tools` vyradi samo, `deploy` uz ne - a protoze
# Dockerfile kopiruje jen pyproject.toml a soc_api, kontejner se postavi
# i tak. Rozbita je proto jen ta nativni a vyvojarska cesta z README.
[tool.setuptools]
# Monorepo: tri nasazovatelne komponenty + sdilena knihovna.
#   soc_api          - prijem vzorku (RW vault), :8095, routa /api
#   soc_orchestrator - analyza (RW vault): pending -> analysis.json report
#   soc_portal       - portal SOC tymu (RO vault), :8096, routa /portal
#   soc_mail         - KNIHOVNA (analyza mailu); importuje ji orchestrator
#                      (a soucasny portal, nez se prepne na cteni reportu)
# Bezi jako oddelene procesy/kontejnery; sdili jen obsah vaultu (soc_api +
# orchestrator pisi atomicky, portal cte). Analyticke deps (extract-msg,
# oletools) patri jen tam, kde bezi analyza (orchestrator, zatim i portal).
packages = ["soc_api", "soc_mail", "soc_orchestrator",
            "soc_portal", "soc_portal.auth", "soc_portal.web"]

# Sablony a staticky portalu nejsou Python - musi se do balicku pribalit rucne.
[tool.setuptools.package-data]
soc_portal = ["web/templates/*.html", "web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
