[project]
name = "soc-api"
version = "0.1.0"
description = "Prijem malware vzorku pro analyzu - REST API nad access-managerem"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["flask>=3.0", "waitress>=3.0", "pyzipper>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Bez tohohle vyctu skonci `pip install -e .` chybou "Multiple top-level
# packages discovered in a flat-layout: ['deploy', 'soc_api']". Setuptools
# si `tests`, `docs` a `tools` vyradi samo, `deploy` uz ne - a protoze
# Dockerfile kopiruje jen pyproject.toml a soc_api, kontejner se postavi
# i tak. Rozbita je proto jen ta nativni a vyvojarska cesta z README.
[tool.setuptools]
# Monorepo: dve nasazovatelne komponenty v jednom repozitari.
#   soc_api    - prijem vzorku (RW vault),  bezi na :8095, routa /api
#   soc_portal - portal SOC tymu (RO vault), bezi na :8096, routa /portal
# Bezi jako oddelene procesy/kontejnery; sdili jen obsah vaultu (soc_api pise,
# soc_portal cte). flask+waitress jsou spolecne zavislosti, portal zadnou navic.
packages = ["soc_api", "soc_portal", "soc_portal.auth", "soc_portal.web"]

# Sablony a staticky portalu nejsou Python - musi se do balicku pribalit rucne.
[tool.setuptools.package-data]
soc_portal = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
